<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <!-- Original illustration, drawn for this site in the poster set's style: an AI
       agent (left), tool servers (right) and the gateway between them. Tool
       outputs pass through; one carrying an injection ("!") is stopped. The
       chain along the ground is the tamper-evident record. -->
  <rect width="500" height="700" fill="#f9b288"/>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700">
    <text x="30" y="196" font-size="160" letter-spacing="-6" fill="#1a222c">GATE</text>
    <text x="470" y="238" font-size="18" letter-spacing="3" text-anchor="end" fill="#1a222c">ATTACKS THAT WORKED: 12 → 5</text>

    <!-- lanes from the servers to the agent: two get through, one is stopped -->
    <line x1="132" y1="372" x2="360" y2="372" stroke="#1a222c" stroke-width="2.5" stroke-dasharray="6 7"/>
    <line x1="292" y1="436" x2="360" y2="436" stroke="#1a222c" stroke-width="2.5" stroke-dasharray="6 7"/>
    <line x1="132" y1="500" x2="360" y2="500" stroke="#1a222c" stroke-width="2.5" stroke-dasharray="6 7"/>

    <!-- tool servers -->
    <rect x="360" y="342" width="100" height="58" rx="6" fill="#2a4a84"/>
    <rect x="360" y="406" width="100" height="58" rx="6" fill="#2a4a84"/>
    <rect x="360" y="470" width="100" height="58" rx="6" fill="#2a4a84"/>
    <rect x="374" y="368" width="44" height="6" fill="#ebd4c1"/>
    <rect x="374" y="432" width="44" height="6" fill="#ebd4c1"/>
    <rect x="374" y="496" width="44" height="6" fill="#ebd4c1"/>
    <circle cx="442" cy="371" r="5" fill="#ffea35"/>
    <circle cx="442" cy="435" r="5" fill="#ffea35"/>
    <circle cx="442" cy="499" r="5" fill="#ffea35"/>
    <rect x="401" y="528" width="18" height="24" fill="#1a222c"/>

    <!-- the gateway, with a keyhole: callers need a key -->
    <rect x="215" y="282" width="70" height="270" fill="#1a222c"/>
    <circle cx="250" cy="318" r="12" fill="#ffea35"/>
    <path d="M244 324 L256 324 L259 348 L241 348 Z" fill="#ffea35"/>

    <!-- outputs in transit: cleared ones on both sides, the injected one held at the gate -->
    <rect x="312" y="360" width="24" height="24" rx="3" fill="#2a4a84"/>
    <rect x="160" y="360" width="24" height="24" rx="3" fill="#2a4a84"/>
    <rect x="292" y="421" width="30" height="30" rx="3" fill="#eb3230"/>
    <text x="307" y="444" font-size="22" text-anchor="middle" fill="#1a222c">!</text>
    <rect x="312" y="488" width="24" height="24" rx="3" fill="#2a4a84"/>
    <rect x="160" y="488" width="24" height="24" rx="3" fill="#2a4a84"/>

    <!-- the AI agent -->
    <line x1="85" y1="380" x2="85" y2="400" stroke="#1a222c" stroke-width="5"/>
    <circle cx="85" cy="376" r="7" fill="#ffea35"/>
    <rect x="40" y="400" width="90" height="80" rx="14" fill="#1a222c"/>
    <circle cx="68" cy="436" r="9" fill="#ffea35"/>
    <circle cx="102" cy="436" r="9" fill="#ffea35"/>
    <rect x="55" y="486" width="60" height="66" rx="8" fill="#1a222c"/>

    <!-- the record: each entry linked to the one before -->
    <line x1="37" y1="563" x2="463" y2="563" stroke="#1a222c" stroke-width="3"/>
    <rect x="30" y="556" width="14" height="14" fill="#f9b288" stroke="#1a222c" stroke-width="3"/>
    <rect x="77" y="556" width="14" height="14" fill="#f9b288" stroke="#1a222c" stroke-width="3"/>
    <rect x="124" y="556" width="14" height="14" fill="#f9b288" stroke="#1a222c" stroke-width="3"/>
    <rect x="171" y="556" width="14" height="14" fill="#f9b288" stroke="#1a222c" stroke-width="3"/>
    <rect x="218" y="556" width="14" height="14" fill="#f9b288" stroke="#1a222c" stroke-width="3"/>
    <rect x="265" y="556" width="14" height="14" fill="#f9b288" stroke="#1a222c" stroke-width="3"/>
    <rect x="312" y="556" width="14" height="14" fill="#f9b288" stroke="#1a222c" stroke-width="3"/>
    <rect x="359" y="556" width="14" height="14" fill="#f9b288" stroke="#1a222c" stroke-width="3"/>
    <rect x="406" y="556" width="14" height="14" fill="#f9b288" stroke="#1a222c" stroke-width="3"/>
    <rect x="453" y="556" width="14" height="14" fill="#1a222c" stroke="#1a222c" stroke-width="3"/>

    <text x="36" y="644" font-size="30" letter-spacing="12" fill="#1a222c">SECURITY</text>
  </g>
</svg>
