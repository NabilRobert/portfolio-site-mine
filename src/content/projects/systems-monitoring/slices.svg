<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 696" width="640" height="696">
<!-- Drawn from systems-monitoring docs/planning; see the matching .source.txt. -->
<rect width="640" height="696" fill="#1a222c"/>
<g font-family="'Helvetica Neue', Helvetica, Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', Meiryo, sans-serif">
<text x="24" y="44" font-size="22" font-weight="700" fill="#ebd4c1">Built in slices</text>
<text x="24" y="70" font-size="14.5" fill="#f9b288">Each slice runs end to end, from a signal to a message on the phone</text>
<rect x="524" y="26" width="92" height="26" rx="4" fill="none" stroke="#ffea35" stroke-width="2"/>
<text x="570" y="44" font-size="12.5" font-weight="700" letter-spacing="1.5" text-anchor="middle" fill="#ffea35">PLANNED</text>
<circle cx="42" cy="112" r="16" fill="#ffea35" stroke="#ffea35" stroke-width="3"/>
<text x="42" y="117.5" font-size="14" font-weight="700" text-anchor="middle" fill="#1a222c">0</text>
<text x="74" y="108" font-size="15.5" font-weight="700" fill="#ebd4c1">Planning  </text>
<text x="616" y="108" font-size="12.5" font-weight="700" letter-spacing="1" text-anchor="end" fill="#ffea35">DONE</text>
<text x="74" y="128" font-size="13.5" fill="#f9b288">Problem, requirements, decisions</text>
<circle cx="42" cy="162" r="16" fill="none" stroke="#ffea35" stroke-width="3"/>
<text x="42" y="167.5" font-size="14" font-weight="700" text-anchor="middle" fill="#ffea35">1</text>
<text x="74" y="158" font-size="15.5" font-weight="700" fill="#ebd4c1">Security alerts  </text>
<text x="616" y="158" font-size="12.5" font-weight="700" letter-spacing="1" text-anchor="end" fill="#ffea35">NEXT</text>
<text x="74" y="178" font-size="13.5" fill="#f9b288">Logins, sudo and new ports, tested</text>
<circle cx="42" cy="212" r="16" fill="none" stroke="#ffea35" stroke-width="3"/>
<text x="42" y="217.5" font-size="14" font-weight="700" text-anchor="middle" fill="#ffea35">2</text>
<text x="74" y="208" font-size="15.5" font-weight="700" fill="#ebd4c1">Deploy on the server</text>
<text x="74" y="228" font-size="13.5" fill="#f9b288">Each alert fired once by hand</text>
<circle cx="42" cy="262" r="16" fill="none" stroke="#ffea35" stroke-width="3"/>
<text x="42" y="267.5" font-size="14" font-weight="700" text-anchor="middle" fill="#ffea35">3</text>
<text x="74" y="258" font-size="15.5" font-weight="700" fill="#ebd4c1">Metrics and probes</text>
<text x="74" y="278" font-size="13.5" fill="#f9b288">Uptime, certificates, memory, disk</text>
<circle cx="42" cy="312" r="16" fill="none" stroke="#ffea35" stroke-width="3"/>
<text x="42" y="317.5" font-size="14" font-weight="700" text-anchor="middle" fill="#ffea35">4</text>
<text x="74" y="308" font-size="15.5" font-weight="700" fill="#ebd4c1">Errors</text>
<text x="74" y="328" font-size="13.5" fill="#f9b288">Stack traces, if it fits in memory</text>
<line x1="24" y1="362" x2="616" y2="362" stroke="#f9b288" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="64" y="348" width="512" height="30" rx="4" fill="#1a222c"/>
<text x="320" y="368" font-size="14" font-weight="700" text-anchor="middle" fill="#f9b288">Checkpoint: The server is watched before Juku’s first user</text>
<circle cx="42" cy="410" r="16" fill="none" stroke="#ffea35" stroke-width="3"/>
<text x="42" y="415.5" font-size="14" font-weight="700" text-anchor="middle" fill="#ffea35">5</text>
<text x="74" y="406" font-size="15.5" font-weight="700" fill="#ebd4c1">Juku’s SLOs</text>
<text x="74" y="426" font-size="13.5" fill="#f9b288">Error budgets and burn alerts</text>
<circle cx="42" cy="460" r="16" fill="none" stroke="#ffea35" stroke-width="3"/>
<text x="42" y="465.5" font-size="14" font-weight="700" text-anchor="middle" fill="#ffea35">6</text>
<text x="74" y="456" font-size="15.5" font-weight="700" fill="#ebd4c1">AI-specific signals</text>
<text x="74" y="476" font-size="13.5" fill="#f9b288">Spend rate, refusals, gateway blocks, quality</text>
<circle cx="42" cy="510" r="16" fill="none" stroke="#ffea35" stroke-width="3"/>
<text x="42" y="515.5" font-size="14" font-weight="700" text-anchor="middle" fill="#ffea35">7</text>
<text x="74" y="506" font-size="15.5" font-weight="700" fill="#ebd4c1">Canary</text>
<text x="74" y="526" font-size="13.5" fill="#f9b288">A scripted agent runs one real task each hour</text>
<circle cx="42" cy="560" r="16" fill="none" stroke="#ffea35" stroke-width="3"/>
<text x="42" y="565.5" font-size="14" font-weight="700" text-anchor="middle" fill="#ffea35">8</text>
<text x="74" y="556" font-size="15.5" font-weight="700" fill="#ebd4c1">Write-up</text>
<text x="74" y="576" font-size="13.5" fill="#f9b288">Runbooks, a monthly report, a postmortem</text>
<rect x="24" y="610" width="3" height="20" fill="#ebd4c1"/>
<text x="38" y="626" font-size="14" fill="#ebd4c1">Everything costs $0. Slices 5 to 8 wait until Juku is live.</text>
<text x="24" y="680" font-size="13" fill="#f9b288">Source: systems-monitoring, slice-plan.md (planning).</text>
</g>
</svg>
