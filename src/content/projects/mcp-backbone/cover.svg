  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700">
    <text x="30" y="196" font-size="192" letter-spacing="-8" fill="#ffea35">MCP</text>
    <rect x="36" y="268" width="428" height="52" fill="#ebd4c1"/>
    <text x="54" y="302" font-size="20" letter-spacing="4" fill="#1a222c">PARSE</text>
    <rect x="36" y="334" width="364" height="52" fill="#f9b288"/>
