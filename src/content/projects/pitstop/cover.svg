<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <!-- Original illustration, drawn for this site: Pitstop's four agents as a pit
       crew around a car, in flat shapes and the site's palette. Each wears an
       initial: A (Anna, analysis, with a chart), R (Rico, recommendations, with
       a sign), S (Sammy, summaries, with a clipboard) and C (Ciri, the critic,
       with the chequered flag). -->
  <rect width="500" height="700" fill="#eb3230"/>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700">
    <text x="30" y="196" font-size="192" letter-spacing="-6" fill="#1a222c">PIT</text>
    <text x="470" y="238" font-size="18" letter-spacing="3" text-anchor="end" fill="#1a222c">11 WEEKS UNATTENDED</text>

    <!-- Rico, behind the car, raising a sign with an arrow -->
    <g>
      <rect x="175" y="500" width="12" height="60" fill="#1a222c"/>
      <rect x="193" y="500" width="12" height="60" fill="#1a222c"/>
      <rect x="170" y="428" width="40" height="76" rx="10" fill="#1a222c"/>
      <line x1="204" y1="440" x2="216" y2="408" stroke="#1a222c" stroke-width="11" stroke-linecap="round"/>
      <rect x="214" y="326" width="5" height="88" fill="#1a222c"/>
      <rect x="196" y="318" width="58" height="40" fill="#ffea35"/>
      <path d="M210 348 L236 330 M224 328 L238 329 L236 343" fill="none" stroke="#1a222c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="190" cy="404" r="24" fill="#ffea35"/>
      <rect x="175" y="398" width="30" height="11" rx="5.5" fill="#1a222c"/>
      <text x="190" y="470" font-size="22" text-anchor="middle" fill="#ebd4c1">R</text>
    </g>

    <!-- Sammy, behind the car, with a clipboard -->
    <g>
      <rect x="303" y="500" width="12" height="60" fill="#1a222c"/>
      <rect x="321" y="500" width="12" height="60" fill="#1a222c"/>
      <rect x="298" y="428" width="40" height="76" rx="10" fill="#1a222c"/>
      <line x1="332" y1="442" x2="346" y2="446" stroke="#1a222c" stroke-width="11" stroke-linecap="round"/>
      <rect x="344" y="414" width="32" height="44" fill="#c2523d"/>
      <rect x="348" y="421" width="24" height="33" fill="#ebd4c1"/>
      <rect x="353" y="409" width="14" height="8" fill="#1a222c"/>
      <rect x="352" y="428" width="16" height="3" fill="#1a222c"/>
      <rect x="352" y="435" width="16" height="3" fill="#1a222c"/>
      <rect x="352" y="442" width="10" height="3" fill="#1a222c"/>
      <circle cx="318" cy="404" r="24" fill="#ffea35"/>
      <rect x="303" y="398" width="30" height="11" rx="5.5" fill="#1a222c"/>
      <text x="318" y="470" font-size="22" text-anchor="middle" fill="#ebd4c1">S</text>
    </g>

    <!-- The car, side on, facing right -->
    <g>
      <rect x="100" y="474" width="8" height="18" fill="#1a222c"/>
      <rect x="86" y="464" width="42" height="10" rx="2" fill="#1a222c"/>
      <path d="M108 524 L108 490 L178 486 L198 466 L252 466 L264 486 L396 502 L418 512 L418 526 Z" fill="#ebd4c1"/>
      <path d="M204 466 L246 466 L240 476 L210 476 Z" fill="#1a222c"/>
      <path d="M264 494 L396 507 L404 512 L264 504 Z" fill="#2a4a84"/>
      <text x="212" y="512" font-size="20" letter-spacing="1" fill="#2a4a84">AI</text>
      <rect x="392" y="520" width="34" height="8" fill="#1a222c"/>
      <circle cx="150" cy="530" r="30" fill="#1a222c"/>
      <circle cx="150" cy="530" r="11" fill="#f9b288"/>
      <circle cx="350" cy="530" r="30" fill="#1a222c"/>
      <circle cx="350" cy="530" r="11" fill="#f9b288"/>
    </g>

    <!-- Anna, at the back of the car, with a tablet showing a chart -->
    <g>
      <rect x="43" y="500" width="12" height="60" fill="#1a222c"/>
      <rect x="61" y="500" width="12" height="60" fill="#1a222c"/>
      <rect x="38" y="428" width="40" height="76" rx="10" fill="#1a222c"/>
      <line x1="42" y1="442" x2="36" y2="490" stroke="#1a222c" stroke-width="11" stroke-linecap="round"/>
      <line x1="72" y1="442" x2="86" y2="440" stroke="#1a222c" stroke-width="11" stroke-linecap="round"/>
      <rect x="78" y="408" width="38" height="50" rx="3" fill="#2a4a84"/>
      <rect x="82" y="412" width="30" height="42" fill="#ebd4c1"/>
      <rect x="85" y="438" width="6" height="12" fill="#2a4a84"/>
      <rect x="94" y="430" width="6" height="20" fill="#2a4a84"/>
      <rect x="103" y="420" width="6" height="30" fill="#2a4a84"/>
      <circle cx="58" cy="404" r="24" fill="#ffea35"/>
      <rect x="43" y="398" width="30" height="11" rx="5.5" fill="#1a222c"/>
      <text x="58" y="470" font-size="22" text-anchor="middle" fill="#ebd4c1">A</text>
    </g>

    <!-- Ciri, at the nose, raising the chequered flag -->
    <g>
      <rect x="433" y="500" width="12" height="60" fill="#1a222c"/>
      <rect x="451" y="500" width="12" height="60" fill="#1a222c"/>
      <rect x="428" y="428" width="40" height="76" rx="10" fill="#1a222c"/>
      <line x1="462" y1="442" x2="468" y2="490" stroke="#1a222c" stroke-width="11" stroke-linecap="round"/>
      <line x1="434" y1="440" x2="418" y2="398" stroke="#1a222c" stroke-width="11" stroke-linecap="round"/>
      <rect x="414" y="316" width="5" height="88" fill="#1a222c"/>
      <rect x="374" y="316" width="40" height="30" fill="#ebd4c1"/>
      <path d="M374 316 h10 v10 h-10 Z M394 316 h10 v10 h-10 Z M384 326 h10 v10 h-10 Z M404 326 h10 v10 h-10 Z M374 336 h10 v10 h-10 Z M394 336 h10 v10 h-10 Z" fill="#1a222c"/>
      <circle cx="448" cy="404" r="24" fill="#ffea35"/>
      <rect x="433" y="398" width="30" height="11" rx="5.5" fill="#1a222c"/>
      <text x="448" y="470" font-size="22" text-anchor="middle" fill="#ebd4c1">C</text>
    </g>

    <rect x="30" y="560" width="440" height="3" fill="#1a222c"/>
    <text x="36" y="644" font-size="30" letter-spacing="12" fill="#1a222c">STOP</text>
  </g>
</svg>
